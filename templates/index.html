{% extends "base.html" %}
{% block title %}监控面板 - 上大选课监控{% endblock %}
{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1><i class="fas fa-chart-pie me-2 text-primary"></i>监控面板</h1>
            <p>系统概览与运行状态</p>
        </div>
        <div>
            <button class="btn btn-outline-danger btn-sm me-2" onclick="toggleMonitor(false)" id="btnStop" style="display:none;">
                <i class="fas fa-stop me-1"></i>停止监控
            </button>
            <button class="btn btn-success btn-sm" onclick="toggleMonitor(true)" id="btnStart">
                <i class="fas fa-play me-1"></i>启动监控
            </button>
        </div>
    </div>
</div>
<div class="page-body">
    <!-- Status Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#dbeafe;color:#1e40af;"><i class="fas fa-microchip"></i></div>
                <div class="stat-value" id="statMonitorStatus">--</div>
                <div class="stat-label">监控状态</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#dcfce7;color:#166534;"><i class="fas fa-book"></i></div>
                <div class="stat-value" id="statCourseCount">--</div>
                <div class="stat-label">监控课程数</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#fef9c3;color:#854d0e;"><i class="fas fa-users"></i></div>
                <div class="stat-value" id="statClassCount">--</div>
                <div class="stat-label">教学班总数</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#fef2f2;color:#991b1b;"><i class="fas fa-bell"></i></div>
                <div class="stat-value" id="statAvailableCount">--</div>
                <div class="stat-label">有空位班级</div>
            </div>
        </div>
    </div>

    <!-- Config Status -->
    <div class="section-card" id="configCard">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0"><i class="fas fa-shield-alt me-2 text-success"></i>连接状态</h5>
            <button class="btn btn-outline-primary btn-sm" onclick="refreshParams()" id="btnRefresh">
                <i class="fas fa-sync-alt me-1"></i>刷新参数
            </button>
        </div>
        <div id="configStatus"><p class="text-muted-small"><i class="fas fa-spinner fa-spin"></i> 加载中...</p></div>
        <div id="countdownArea" class="mt-3" style="display:none;"></div>
    </div>

    <!-- Monitored Courses -->
    <div class="section-card">
        <h5><i class="fas fa-list me-2 text-primary"></i>当前监控列表</h5>
        <div id="watchlistContainer">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>暂无监控课程</p>
                <p class="text-muted-small">前往「课程监控」页面添加课程</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function toggleMonitor(start) {
    const action = start ? 'start' : 'stop';
    apiFetch(`/api/monitor/${action}`, { method: 'POST' }).then(data => {
        if (data && data.success) {
            showToast(data.message, 'success');
            loadDashboard();
        } else if (data) {
            showToast(data.message, 'warning');
        }
    });
}

function loadDashboard() {
    apiFetch('/api/monitor/status').then(data => {
        if (!data) return;
        const running = data.running;
        document.getElementById('btnStart').style.display = running ? 'none' : '';
        document.getElementById('btnStop').style.display = running ? '' : 'none';
        document.getElementById('statMonitorStatus').textContent = running ? '运行中' : '已停止';
        document.getElementById('statMonitorStatus').style.color = running ? '#22c55e' : '#ef4444';

        const watchlist = data.watchlist || [];
        document.getElementById('statCourseCount').textContent = watchlist.length;

        let totalClasses = 0, available = 0;
        watchlist.forEach(w => {
            totalClasses += (w.classes || []).length;
            (w.classes || []).forEach(c => { if (c.remaining > 0) available++; });
        });
        document.getElementById('statClassCount').textContent = totalClasses;
        document.getElementById('statAvailableCount').textContent = available;

        // Render watchlist
        const container = document.getElementById('watchlistContainer');
        if (watchlist.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>暂无监控课程</p>
                    <p class="text-muted-small">前往「课程监控」页面添加课程</p>
                </div>`;
            return;
        }

        let html = '<div class="table-responsive"><table class="table table-course"><thead><tr><th>课程/班级</th><th>教师</th><th>时间</th><th>教室</th><th>已选/容量</th><th>状态</th></tr></thead><tbody>';
        watchlist.forEach(w => {
            const classes = w.classes || [];
            if (classes.length === 0) {
                html += `<tr><td colspan="6" class="text-muted">${w.name} (${w.kch_id || ''}) — 暂无数据</td></tr>`;
            }
            classes.forEach(c => {
                const pct = c.capacity > 0 ? Math.round((c.enrolled / c.capacity) * 100) : 0;
                const statusBadge = c.remaining > 0
                    ? `<span class="badge badge-available">有空位 (余${c.remaining})</span>`
                    : `<span class="badge badge-full">已满 ${pct}%</span>`;
                const notifiedBadge = c.notified ? `<span class="badge badge-notified ms-1"><i class="fas fa-bell"></i></span>` : '';
                html += `<tr>
                    <td><strong>${c.name || w.name}</strong>${notifiedBadge}</td>
                    <td>${c.teacher || '--'}</td>
                    <td>${c.time || '--'}</td>
                    <td>${c.room || '--'}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span>${c.enrolled}/${c.capacity}</span>
                            <div class="progress flex-grow-1" style="height:6px;max-width:80px;">
                                <div class="progress-bar ${pct >= 90 ? 'bg-danger' : pct >= 70 ? 'bg-warning' : 'bg-success'}" style="width:${pct}%"></div>
                            </div>
                        </div>
                    </td>
                    <td>${statusBadge}</td>
                </tr>`;
            });
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
    });
}

function loadConfig() {
    // 同时获取 config 和 health
    Promise.all([
        apiFetch('/api/config'),
        apiFetch('/api/health')
    ]).then(([configData, healthData]) => {
        if (!configData) return;
        const el = document.getElementById('configStatus');
        const health = healthData || {};

        // Cookie 状态
        const cookiesRealOk = health.cookies_valid;
        const cookieIcon = cookiesRealOk ? 'fa-check-circle text-success' : 'fa-times-circle text-danger';
        const cookieText = cookiesRealOk
            ? `Cookie 有效 ${health.cookie_msg ? '(' + health.cookie_msg + ')' : ''}`
            : `Cookie 无效: ${health.cookie_msg || '请更新 Cookies'}`;
        const cookieColor = cookiesRealOk ? '#22c55e' : '#ef4444';

        // 学期显示
        const semesterName = configData.xkxqmc || '';
        const semesterCode = configData.xkxqm || '?';
        const semesterLabel = semesterName
            ? `${configData.xkxnmc || configData.xkxnm || '?'}学年 ${semesterName}学期`
            : `学年 ${configData.xkxnm || '?'} / 学期代码 ${semesterCode}`;

        const html = `
            <div class="row g-3">
                <div class="col-md-3"><small class="text-muted d-block">检查间隔</small><span class="fw-medium">${configData.check_interval} 秒</span></div>
                <div class="col-md-3"><small class="text-muted d-block">当前学期</small><span class="fw-medium">${semesterLabel}</span></div>
                <div class="col-md-3"><small class="text-muted d-block">教务系统</small><span class="fw-medium"><a href="${configData.base_url}" target="_blank" class="text-decoration-none">jwxt.shu.edu.cn</a></span></div>
                <div class="col-md-3"><small class="text-muted d-block">Cookie状态</small><span class="fw-medium" style="color:${cookieColor}"><i class="fas ${cookieIcon} me-1"></i>${cookieText}</span></div>
            </div>`;
        el.innerHTML = html;

        // 选课倒计时
        updateCountdown(configData.xkkssj, configData.xkjssj);
    });
}

function updateCountdown(startTime, endTime) {
    const area = document.getElementById('countdownArea');
    if (!startTime) { area.style.display = 'none'; return; }

    area.style.display = 'block';
    const start = new Date(startTime.replace(/-/g, '/'));
    const end = endTime ? new Date(endTime.replace(/-/g, '/')) : null;
    const now = new Date();

    let html = '';
    if (now < start) {
        const diff = start - now;
        const hours = Math.floor(diff / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        html = `
            <div class="alert alert-info border-0 shadow-sm" style="background:#eff6ff;border-left:4px solid #3b82f6 !important;">
                <i class="fas fa-clock me-2"></i><strong>选课倒计时</strong>
                <span class="ms-3 font-monospace" style="font-size:18px;">${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</span>
                <small class="text-muted ms-2">开始时间: ${startTime}</small>
            </div>`;
    } else if (end && now > end) {
        html = `<div class="alert alert-secondary border-0"><i class="fas fa-info-circle me-2"></i>选课已结束 (${endTime})</div>`;
    } else {
        const diff = end ? end - now : 0;
        const hours = Math.floor(diff / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        html = `
            <div class="alert alert-success border-0 shadow-sm" style="background:#f0fdf4;border-left:4px solid #22c55e !important;">
                <i class="fas fa-play-circle me-2"></i><strong>选课进行中！</strong>
                ${end ? `<span class="ms-3">剩余时间: ${hours}小时${mins}分</span>` : ''}
                <small class="text-muted ms-2">(${startTime} ~ ${endTime || '未知'})</small>
            </div>`;
    }
    area.innerHTML = html;
}

function refreshParams() {
    const btn = document.getElementById('btnRefresh');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>刷新中...';
    apiFetch('/api/refresh', { method: 'POST' }).then(data => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>刷新参数';
        if (data && data.success) {
            showToast(data.message + (data.semester ? ' → ' + data.semester : ''), 'success');
            loadConfig();
            loadDashboard();
        } else {
            showToast((data && data.message) || '刷新失败', 'danger');
        }
    });
}

loadDashboard();
loadConfig();
setInterval(loadDashboard, 5000);
setInterval(loadConfig, 10000);  // 每10秒刷新一次状态（含倒计时）
</script>
{% endblock %}
