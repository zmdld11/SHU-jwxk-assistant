{% extends "base.html" %}
{% block title %}抢课/退课 - 上大选课监控{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-crosshairs me-2 text-danger"></i>抢课 / 退课</h1>
    <p>查询课程 → 监控抢课 → 有空位自动选；或从已选课程退课</p>
</div>
<div class="page-body">
    <div class="row">
        <div class="col-md-5">
            <!-- Query & Add -->
            <div class="section-card">
                <h5><i class="fas fa-search me-2 text-primary"></i>查询课程</h5>
                <p class="text-muted-small">输入课程号，查看教学班并启动监控抢课</p>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="grabCourseInput"
                           placeholder="输入课程号，如 08305011" onkeydown="if(event.key==='Enter') grabQueryCourse()">
                    <button class="btn btn-primary" onclick="grabQueryCourse()" id="grabQueryBtn">
                        <i class="fas fa-search me-1"></i>查询
                    </button>
                </div>
                <div id="grabQueryResult" style="max-height:500px;overflow-y:auto;"></div>
            </div>

            <!-- Auto Grab List -->
            <div class="section-card">
                <h5><i class="fas fa-bell me-2 text-danger"></i>自动抢课</h5>
                <p class="text-muted-small">查到的课程点「监控抢课」后，系统自动监控空位</p>
                <div id="autoGrabList">
                    <div class="empty-state"><i class="fas fa-inbox"></i><p>暂无任务</p><p class="text-muted-small">搜索课程后点「监控抢课」</p></div>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <!-- Enrolled Courses -->
            <div class="section-card">
                <h5><i class="fas fa-book me-2 text-success"></i>已选课程</h5>
                <p class="text-muted-small">系统已预加载课表，可直接退选</p>
                <div id="enrolledList">
                    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>加载中...</p></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
var lastGrabQuery = null;

function grabQueryCourse() {
    var kch_id = document.getElementById('grabCourseInput').value.trim();
    if (!kch_id) { showToast('请输入课程号', 'warning'); return; }
    var btn = document.getElementById('grabQueryBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 查询中...';
    apiFetch('/api/monitor/query', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kch_id: kch_id }),
    }).then(function(data) {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-search me-1"></i>查询';
        var div = document.getElementById('grabQueryResult');
        if (!data || !data.success || data.count === 0) {
            div.innerHTML = '<div class="alert alert-warning py-2">未找到该课程</div>';
            lastGrabQuery = null; return;
        }
        lastGrabQuery = data;
        var html = '<div class="mb-1"><small class="text-muted">找到 ' + data.count + ' 个教学班</small></div>';
        data.classes.forEach(function(c) {
            var status = '';
            if (c.is_enrolled) {
                status = '<span class="badge bg-secondary">已选</span>';
            } else if (c.conflict) {
                status = '<span class="conflict-tag"><i class="fas fa-exclamation-triangle"></i> 冲突</span>';
            } else {
                status = '<span style="color:#22c55e;font-size:12px;"><i class="fas fa-check"></i> 可抢</span>';
            }
            var remaining = c.remaining > 0
                ? '<span class="badge badge-available">余'+c.remaining+'</span>'
                : '<span class="badge badge-full">已满</span>';
            var cname = c.course_name || kch_id;
            var addBtn = c.is_enrolled
                ? '<span class="text-muted">已选</span>'
                : '<button class="btn btn-sm btn-danger ms-2" onclick="addAutoGrab(\''+c.jxb_id+'\',\''+kch_id+'\',\''+(cname.replace(/'/g,""))+'\')">监控抢课</button>';
            html += '<div class="card mb-1 border" style="font-size:13px;">'
                + '<div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">'
                + '<div style="flex:1;min-width:0;">'
                + '<div><strong>' + cname + '</strong> | ' + (c.skjs || '--') + '</div>'
                + '<div style="font-size:12px;">' + (c.sksj || '').replace(/<br\s*\/?>/gi,' ') + '</div>'
                + '<div class="d-flex gap-1 mt-1">' + remaining + ' ' + status + '</div>'
                + '</div><div class="text-end">' + addBtn + '</div></div></div>';
        });
        div.innerHTML = html;
    });
}

function addAutoGrab(jxbId, kchId, name) {
    if (!confirm('启动自动抢课: ' + name + '？\n系统将持续监控，有空位自动选课')) return;
    apiFetch('/api/grab/auto/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kch_id: kchId, jxb_id: jxbId, name: name }),
    }).then(function(d) {
        if (d && d.success) { showToast('已加入自动抢课', 'success'); loadAutoGrabs(); }
        else if (d) { showToast(d.message, 'danger'); }
    });
}

function removeAutoGrab(gid) {
    apiFetch('/api/grab/auto/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gid: gid }),
    }).then(function(d) {
        if (d && d.success) { showToast('已移除', 'success'); loadAutoGrabs(); }
    });
}

function dropCourse(jxbId, kchId) {
    if (!confirm('确定要退课吗？')) return;
    apiFetch('/api/drop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kch_id: kchId, jxb_ids: jxbId }),
    }).then(function(d) {
        if (d && d.success) { showToast('退课成功', 'success'); loadEnrolled(); loadAutoGrabs(); }
        else if (d) { showToast(d.message, 'danger'); }
    });
}

function loadAutoGrabs() {
    apiFetch('/api/grab/auto/list').then(function(data) {
        var div = document.getElementById('autoGrabList');
        if (data && !data.cookies_valid) {
            div.innerHTML = '<div class=\"alert alert-danger py-2\" style=\"font-size:13px;\"><i class=\"fas fa-exclamation-triangle\"></i> <strong>Cookies 已过期！</strong><br>所有自动抢课已暂停，请更新 Cookies 后重启系统。</div>';
            return;
        }
        if (!data || !data.grabs || Object.keys(data.grabs).length === 0) {
            div.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无任务</p></div>'; return;
        }
        var html = '';
        for (var gid in data.grabs) {
            var g = data.grabs[gid];
            var latest = g.latest || {};
            var remaining = latest.remaining !== undefined ? ('余' + latest.remaining + '/' + (latest.capacity || '?')) : '等待检查';
            var statusCls = g.status === '成功' ? 'text-success' : (g.status.indexOf('失败')>=0 ? 'text-danger' : 'text-muted');
            html += '<div class="card mb-1 border" style="font-size:13px;">'
                + '<div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">'
                + '<div><strong>' + (g.name || g.kch_id) + '</strong><br>'
                + '<small class="' + statusCls + '">' + g.status + '</small>'
                + ' <small class="text-muted">' + remaining + '</small></div>'
                + '<button class="btn btn-sm btn-outline-danger" onclick="removeAutoGrab(\''+gid+'\')"><i class="fas fa-times"></i></button>'
                + '</div></div>';
        }
        div.innerHTML = html;
    });
}

function loadEnrolled() {
    apiFetch('/api/enrolled').then(function(data) {
        var div = document.getElementById('enrolledList');
        if (!data || !data.success) {
            div.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>加载中...</p></div>'; return;
        }
        if (data.count === 0) {
            div.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无已选课程</p></div>'; return;
        }
        var html = '';
        data.courses.forEach(function(c) {
            if (!c.jxb_id) {
                html += '<div class="card mb-1 border" style="font-size:13px;"><div class="card-body py-2 px-3"><strong>' + c.kcmc + '</strong></div></div>';
                return;
            }
            html += '<div class="card mb-1 border" style="font-size:13px;">'
                + '<div class="card-body py-2 px-3 d-flex justify-content-between align-items-center">'
                + '<div><strong>' + c.kcmc + '</strong><br><small class="text-muted">' + (c.kch_id ||'') + '</small></div>'
                + '<button class="btn btn-sm btn-outline-danger" onclick="if(confirm(\'退课？\'))dropCourse(\''+c.jxb_id+'\',\''+c.kch_id+'\')"><i class="fas fa-trash me-1"></i>退课</button>'
                + '</div></div>';
        });
        div.innerHTML = html;
    });
}

loadAutoGrabs();
loadEnrolled();
setInterval(loadAutoGrabs, 3000);
</script>
{% endblock %}
