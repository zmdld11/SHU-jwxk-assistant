<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}上大选课监控{% endblock %}</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --sidebar-width: 260px;
            --sidebar-bg: #ffffff;
            --sidebar-border: #f0f2f5;
            --sidebar-hover: #f8fafc;
            --sidebar-active: #eef2ff;
            --sidebar-active-text: #4f46e5;
            --content-bg: #f8fafc;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-border: rgba(226, 232, 240, 0.8);
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--content-bg);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Sidebar */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width);
            background: var(--sidebar-bg); z-index: 1000;
            display: flex; flex-direction: column;
            border-right: 1px solid var(--sidebar-border);
            transition: transform 0.3s ease;
        }
        .sidebar-brand {
            padding: 24px; color: var(--text-main); font-size: 18px; font-weight: 700;
            border-bottom: 1px solid var(--sidebar-border);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-brand i { 
            color: #fff; background: var(--primary); padding: 8px; border-radius: 8px;
            font-size: 16px; 
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.3);
        }
        .sidebar-brand small { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .sidebar-nav .nav-item {
            display: flex; align-items: center; padding: 12px 16px; margin-bottom: 4px;
            color: var(--text-muted); text-decoration: none; transition: all 0.2s;
            border-radius: 10px; font-weight: 500; font-size: 14px;
        }
        .sidebar-nav .nav-item:hover { 
            background: var(--sidebar-hover); color: var(--text-main); 
        }
        .sidebar-nav .nav-item.active { 
            background: var(--sidebar-active); color: var(--sidebar-active-text); 
        }
        .sidebar-nav .nav-item i { width: 22px; font-size: 16px; margin-right: 8px; }
        .sidebar-footer {
            padding: 16px 20px; border-top: 1px solid var(--sidebar-border);
            color: var(--text-muted); font-size: 12px; text-align: center;
        }

        /* Main content */
        .main-content {
            margin-left: var(--sidebar-width); min-height: 100vh;
            padding: 0; transition: margin-left 0.3s ease;
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 36px; 
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            position: sticky; top: 0; z-index: 900;
        }
        .page-header h1 { font-size: 22px; font-weight: 700; color: var(--text-main); margin: 0; display: flex; align-items: center; gap: 10px; }
        .page-header p { color: var(--text-muted); font-size: 14px; margin: 4px 0 0; }
        .page-body { padding: 30px 36px; }

        /* Cards */
        .section-card {
            background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 24px;
            border: 1px solid var(--card-border); 
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .section-card:hover { 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04); 
            border-color: rgba(203, 213, 225, 0.8);
        }
        .section-card h5 { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;}
        
        .stat-card {
            background: #fff; border-radius: 16px; padding: 24px;
            border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
            transition: all 0.2s; height: 100%;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .stat-card .stat-icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-bottom: 16px; background: var(--sidebar-active); color: var(--primary);
        }
        .stat-card .stat-value { font-size: 32px; font-weight: 700; color: var(--text-main); line-height: 1.2;}
        .stat-card .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

        /* Buttons & Forms */
        .btn { padding: 10px 20px; border-radius: 10px; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background-color: var(--primary); border-color: var(--primary); box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { background-color: var(--primary-hover); border-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.3); }
        .form-control, .form-select { border-radius: 10px; border: 1px solid #cbd5e1; padding: 10px 14px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); transition: all 0.2s; }
        .form-control:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        .form-label { font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 6px; }

        /* Badges */
        .badge { padding: 5px 10px; border-radius: 6px; font-weight: 500; letter-spacing: 0.3px; }
        .badge-available { background: #dcfce7; color: #166534; }
        .badge-full { background: #fee2e2; color: #991b1b; }
        .badge-notified { background: #e0e7ff; color: #3730a3; }
        .badge-pending { background: #fef3c7; color: #92400e; }

        /* Status dot */
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px;
        }
        .status-dot.running { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }
        .status-dot.stopped { background: #ef4444; }
        .status-dot.pending { background: #f59e0b; }

        /* Tables */
        .table-course { font-size: 14px; margin-bottom: 0; }
        .table-course th { 
            border-top: none; color: var(--text-muted); font-weight: 600; 
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; 
            background: #f8fafc; padding: 12px 16px; border-bottom: 2px solid #e2e8f0;
        }
        .table-course td { vertical-align: middle; padding: 14px 16px; border-bottom: 1px solid #f1f5f9; color: var(--text-main); }
        .table-course tr:last-child td { border-bottom: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Schedule Grid */
        .schedule-grid {
            display: grid; grid-template-columns: 60px repeat(5, 1fr);
            gap: 4px; font-size: 13px; background: var(--card-border); padding: 4px; border-radius: 12px;
        }
        .schedule-header { background: #f8fafc; color: var(--text-muted); padding: 12px 0; text-align: center; font-weight: 600; border-radius: 8px; text-transform: uppercase; font-size: 12px;}
        .schedule-time { background: #fff; padding: 10px; text-align: center; font-weight: 600; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
        .schedule-cell { background: #fff; padding: 6px; min-height: 60px; border-radius: 8px; position: relative; transition: transform 0.2s;}
        .schedule-cell:hover { transform: scale(1.02); z-index: 10; box-shadow: var(--card-shadow); }
        .schedule-cell .course-item {
            background: #eef2ff; color: #4338ca; padding: 6px 8px; border-radius: 6px;
            font-size: 12px; margin-bottom: 4px; border-left: 3px solid var(--primary);
            font-weight: 500; display: flex; flex-direction: column; gap: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }
        .schedule-cell .course-item:hover {
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transform: translateY(-1px);
        }
        
        /* Modern Accordion overrides */
        .accordion-button { font-weight: 500; border-radius: 10px !important; }
        .accordion-button:not(.collapsed) { background-color: var(--sidebar-active); color: var(--primary); box-shadow: inset 0 -1px 0 rgba(0,0,0,.125); }
        .accordion-item { border: 1px solid var(--card-border); border-radius: 12px !important; margin-bottom: 8px; overflow: hidden; }
        
        /* Toast Notifications */
        .toast-container { z-index: 1060; }
        .toast { border-radius: 12px; border: none; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-graduation-cap"></i>
        <div>
            <span>选课·监控</span>
            <small>上海大学 · 课程助手</small>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
            <i class="fas fa-chart-pie"></i> 监控面板
        </a>
        <a href="/monitor" class="nav-item {% if request.path == '/monitor' %}active{% endif %}">
            <i class="fas fa-eye"></i> 课程监控
        </a>
        <a href="/grab" class="nav-item {% if request.path == '/grab' %}active{% endif %}">
            <i class="fas fa-crosshairs"></i> 抢课/退课
        </a>
        <a href="/schedule" class="nav-item {% if request.path == '/schedule' %}active{% endif %}">
            <i class="fas fa-calendar-alt"></i> 我的课表
        </a>
        <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
            <i class="fas fa-cog"></i> 系统设置
        </a>
    </nav>
    <div class="sidebar-footer">
        <div id="sidebar-status">
            <span class="status-dot stopped"></span>
            <span>检查配置中...</span>
        </div>
    </div>
</div>

<!-- Main Content -->
<div class="main-content" id="main-content">
    {% block content %}{% endblock %}
</div>

<!-- Toast container -->
<div class="toast-wrapper" style="position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:99999; pointer-events:none;">
<div class="toast-inner" id="toastContainer" style="display:flex; flex-direction:column; align-items:center; gap:8px;"></div>
</div>

<!-- Scripts -->
<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" defer></script>
<script>
// Toast notification - centered at top
function showToast(message, type) {
    type = type || 'success';
    var icons = {success:'fa-check-circle', danger:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle'};
    var bgColors = {success:'#22c55e', danger:'#ef4444', warning:'#f59e0b', info:'#3b82f6'};
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.style.cssText = 'pointer-events:auto;padding:12px 20px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;'
        + 'background:'+(bgColors[type]||bgColors.info)+';box-shadow:0 4px 20px rgba(0,0,0,0.15);'
        + 'display:flex;align-items:center;gap:8px;animation:fadeInDown 0.3s ease;';
    toast.innerHTML = '<i class="fas '+(icons[type]||icons.info)+' fa-lg"></i><span>'+message+'</span>';
    container.appendChild(toast);
    setTimeout(function(){ toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(function(){toast.remove();},300); }, 3500);
}
// Animation keyframes
var styleEl = document.createElement('style');
styleEl.textContent = '@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}';
document.head.appendChild(styleEl);

// Sidebar status
function updateSidebarStatus() {
    fetch('/api/health')
        .then(r => r.json())
        .then(data => {
            const el = document.getElementById('sidebar-status');
            if (!data.cookies_valid) {
                el.innerHTML = '<span class="status-dot" style="background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,0.4);"></span><span style="color:#ef4444">Cookies已过期</span>';
            } else if (data.monitor_running) {
                el.innerHTML = '<span class="status-dot running"></span><span style="color:#22c55e">监控运行中</span>';
            } else {
                el.innerHTML = '<span class="status-dot stopped"></span><span style="color:#ef4444">监控已停止</span>';
            }
        })
        .catch(() => {});
}
updateSidebarStatus();
setInterval(updateSidebarStatus, 5000);

// Format datetime
function formatTime(d) {
    const date = new Date(d);
    return date.toLocaleString('zh-CN', { hour12: false });
}

// Handle fetch errors
async function apiFetch(url, options = {}) {
    try {
        const resp = await fetch(url, options);
        return await resp.json();
    } catch (e) {
        showToast('网络请求失败: ' + e.message, 'danger');
        return null;
    }
}

// Toggle sidebar on mobile
document.addEventListener('DOMContentLoaded', function() {
    // Add mobile toggle button
    const header = document.querySelector('.page-header');
    if (header) {
        const toggle = document.createElement('button');
        toggle.className = 'btn btn-sm d-md-none me-2';
        toggle.innerHTML = '<i class="fas fa-bars"></i>';
        toggle.onclick = () => document.getElementById('sidebar').classList.toggle('show');
        header.querySelector('h1')?.before(toggle);
    }
});
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
